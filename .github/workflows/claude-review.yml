name: Claude PR Review

# Automated first-pass review on every pull request.
# Requires the ANTHROPIC_API_KEY repository secret (see claude.yml).

on:
  pull_request:
    types: [opened, ready_for_review]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request as a critical but constructive teammate.
            Focus on: correctness bugs, violations of the invariants in
            CLAUDE.md (ArchiMate exchange-format rules, stage transitions only
            via WorkflowEngine.advance, settings-only config), missing tests
            for changed behaviour, and API/CLI contract breaks. Post findings
            as inline comments where possible; end with a short summary
            comment. Do not nitpick style that ruff already enforces.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"'
